<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .slash { animation: slash 4s ease-in-out infinite; }
    .brush { animation: paint 4s ease-in-out infinite; }
    .trail { stroke-dasharray: 1; animation: draw 4s ease-in-out infinite; }
    @keyframes slash {
      0%, 18%, 100% { opacity: 1; }
      29%, 85% { opacity: 0; }
    }
    @keyframes paint {
      0%, 18%, 100% { opacity: 0; transform: translate(0, 0); }
      29%, 39% { opacity: 1; transform: translate(-6px, 3px); }
      64%, 76% { opacity: 1; transform: translate(10px, 3px); }
      91% { opacity: 0; transform: translate(10px, 0); }
    }
    @keyframes draw {
      0%, 39% { stroke-dashoffset: 1; opacity: 1; }
      64%, 76% { stroke-dashoffset: 0; opacity: 1; }
      91%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slash, .brush, .trail { animation: none; }
      .slash { opacity: 0; }
    }
  </style>
  <path d="m13 16-8 8 8 8m22-16 8 8-8 8" stroke-width="3"/>
  <path class="slash" d="m28 12-8 24" stroke-width="3"/>
  <path class="trail" d="M14 36q8 0 16 0" pathLength="1" stroke-width="1.8"/>
  <g class="brush" stroke-width="1.6">
    <path d="m21 26 7-15a1.8 1.8 0 0 1 3.3 1.5L25 28Z" fill="#111"/>
    <path d="M21 26c-3 0-2 4-1 7 3-1 6-2 5-5Z" fill="#fff"/>
  </g>
</svg>
