<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirLauncher | 1 Million+ Devices</title>
<style>
@font-face{font-family:Poppins;src:url(assets/Poppins-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(assets/Poppins-SemiBold.ttf);font-weight:600;font-display:swap}
@font-face{font-family:Poppins;src:url(assets/Poppins-Bold.ttf);font-weight:700;font-display:swap}
:root{--azure:#2a7de1;--aqua:#72d6f1;--white:#fff;--navy:#050c21;--left-inset:8.8cqw}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#020610;color:var(--white);font-family:Poppins,sans-serif}
.poster{isolation:isolate;position:relative;overflow:hidden;width:min(100vw,75svh,1080px);aspect-ratio:3/4;container-type:inline-size;background:var(--navy);text-align:center}
.hero{position:absolute;inset:0;overflow:hidden;background:var(--navy)}
.hero video{display:block;position:absolute;top:9.65%;width:100%;height:100%;object-fit:cover;object-position:73% center}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#000 0%,#000 12%,#000a 39%,transparent 64%),linear-gradient(170deg,transparent 50%,var(--overlay-color) 100%);animation:overlay-tint 12s ease-in-out infinite alternate}
@property --overlay-color{syntax:"<color>";inherits:false;initial-value:#000}
@keyframes overlay-tint{from{--overlay-color:#000}to{--overlay-color:#080808}}
.copy{position:absolute;inset:0 var(--left-inset);text-align:left}
.brand{position:absolute;top:10.37cqw;display:flex;align-items:center;gap:3.24cqw;height:7cqw}
.brand img{display:block;width:31.1cqw;height:100%;object-fit:contain}
.subtitle{position:absolute;top:53.5cqw;margin:0;width:59.35cqw;font-size:3.55cqw;line-height:1.5;color:#e1ecfb}
h1{position:absolute;top:31.23cqw;margin:0;font-size:5.55cqw;font-weight:600;letter-spacing:.012em;line-height:1.5;white-space:nowrap}
.metric{display:block;position:absolute;top:6.3cqw;left:0;margin:0;font-size:11.1cqw;font-weight:inherit;letter-spacing:inherit;white-space:nowrap;line-height:1.5;color:#a5adbb;background:linear-gradient(105deg,#f7f7f7,#d2d2d2 38%,#fafafa 71%,#e0e0e0);background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.008em #ffffff59;filter:drop-shadow(0 .025em 0 #171717)}
.metric-glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,#fff5 0%,#fffe 23%,#fff6 45%,#fffc 67%,#ffffffbb 72%,#fff8 79%,#fff5 100%);background-size:155% 100%;background-position:25% 0;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 0 .065em #ffffff60) drop-shadow(0 0 .14em #ffffff35);animation:metric-glint 6s ease-in-out infinite alternate}
@keyframes metric-glint{from{background-position:0% 0}to{background-position:100% 0}}
@media(prefers-reduced-motion:reduce){.metric-glint,.hero::after{animation:none}}
.media-control{position:absolute;bottom:3cqw;right:3cqw;display:grid;place-items:center;width:max(36px,5cqw);aspect-ratio:1;border:1px solid #ffffff60;border-radius:50%;color:white;background:#050c21a0;font:inherit;font-size:max(14px,2cqw);cursor:pointer}
.footer{position:absolute;inset:108.52cqw var(--left-inset) auto;display:grid;justify-items:start;text-align:left;gap:2.47cqw}
.footer p{margin:0;font-size:2.9cqw;font-weight:400}
.download{display:inline-flex;align-items:center;gap:1.6cqw;height:5.56cqw;padding:0 3.05cqw;border:1px solid transparent;border-radius:999px;background:linear-gradient(#07080c,#030407) padding-box,conic-gradient(from var(--download-angle),#090a0e 0%,#10213b 35%,#d7f6ff 47%,#174680 56%,var(--azure) 63%,var(--aqua) 72%,#123b60 79%,#090a0e 93%) border-box;box-shadow:.2cqw .04cqw .65cqw #2a7de155;color:white;text-decoration:none;font-size:2.35cqw;font-weight:600}
@property --download-angle{syntax:"<angle>";inherits:false;initial-value:235deg}
.download{animation:download-glow 24s linear infinite}
@keyframes download-glow{to{--download-angle:595deg}}
@media(prefers-reduced-motion:reduce){.download{animation:none}}
.download:hover,.download:focus-visible{box-shadow:.2cqw .04cqw 1cqw #72d6f188}
.download svg{width:1.05em;height:1.05em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="poster">
  <div class="hero">
    <video id="hero-video" aria-label="AirLauncher product video" muted loop playsinline preload="metadata">
      <source src="assets/airLauncher.mp4" type="video/mp4">
    </video>
  </div>
  <header class="copy">
    <div class="brand">
      <img src="assets/airlauncher-wordmark.png" alt="AirLauncher">
    </div>
    <h1>Empower Devices<br><strong class="metric">1 Million+<span class="metric-glint" aria-hidden="true">1 Million+</span></strong></h1>
    <p class="subtitle">Effortlessly Customize Your Android Devices.</p>
  </header>
  <footer class="footer">
    <a class="download" href="https://www.pax.com.cn/m/airlauncher/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>
      Download
    </a>
    <p>Thank You for Being Part of Our Journey!</p>
  </footer>
  <button class="media-control" type="button" aria-label="Play product video" hidden>▶</button>
</main>
<script>
const video = document.querySelector('#hero-video');
const control = document.querySelector('.media-control');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
video.addEventListener('loadeddata', () => {
  control.hidden = false;
  if (!reducedMotion.matches) video.play().catch(() => {});
});
function updateControl() {
  control.textContent = video.paused ? '▶' : 'Ⅱ';
  control.setAttribute('aria-label', video.paused ? 'Play product video' : 'Pause product video');
}
video.addEventListener('play', updateControl);
video.addEventListener('pause', updateControl);
control.addEventListener('click', () => {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
});
</script>
</body>
</html>
